<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英語タイピング | DEKIRU Classroom</title><link rel="stylesheet" href="typing.css?v=20261028a"></head><body>
<main class="player-layout"><header class="player-header"><button id="sound-toggle" type="button" aria-pressed="true" aria-label="音声をオフにする">🔊 音声オン</button><p class="eyebrow">ENGLISH TYPING</p><h1 id="title">英語タイピング</h1><p id="instructions"></p><p id="progress"></p></header>
<section id="practice" class="panel" hidden>
<div class="meaning"><img id="picture" alt="" hidden><p id="japanese"></p></div>
<div class="actions"><button id="listen" type="button">🔊 発音を聞く</button><button id="listen-slow" type="button">🔊 ゆっくり聞く</button><button id="toggle-model" type="button" aria-pressed="true">綴りを隠す</button></div>
<section class="model-section" aria-label="お手本"><h2>お手本</h2><p id="model" lang="en" class="spelling"></p></section>
<section id="previous-attempt" hidden aria-label="あなたの入力"><h2>あなたの入力</h2><p id="previous" class="spelling" lang="en"></p><p id="error-detail" role="status" style="white-space:pre-line;font-size:20px;font-weight:bold;color:#a51d31"></p><p class="help">赤い文字・□のところを確認して、全体をもう一度入力しよう。</p></section>
<form id="answer-form"><label for="answer">英語を入力する</label><input id="answer" lang="en" type="text" maxlength="500" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-describedby="feedback"><div class="actions"><button id="check" class="primary" type="submit">答え合わせ</button><button id="next" type="button" hidden>次へ</button><button id="skip" type="button">いったん次へ</button></div></form>
<p id="feedback" role="status" aria-live="polite"></p>
</section>
<section id="complete" class="panel" hidden><h2>練習が終わりました</h2><p id="result"></p><div class="actions"><button id="retry-skipped" type="button" hidden>後回しにした問題を練習</button><button id="restart" type="button">もう一度はじめから</button></div></section>
<p id="fatal" role="status" aria-live="polite"></p>
</main><script src="catalog.js"></script><script src="../grade34/share-codec.js"></script><script src="typing-core.js?v=20261028"></script><script src="typing-player.js?v=20261028b"></script></body></html>
