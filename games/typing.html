<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英語タイピング | DEKIRU Classroom</title><link rel="stylesheet" href="typing.css?v=20261028f"></head><body>
<main class="player-layout"><header class="player-header compact-header"><div class="heading-line"><span class="eyebrow">ENGLISH TYPING</span><span id="unit-label"></span><span id="mode-label"></span><span id="progress"></span></div><h1 id="title" class="visually-hidden">英語タイピング</h1><p id="instructions"></p>
<div id="audio-settings" class="typing-audio-controls" aria-label="音声設定" hidden><div class="typing-icon-row"><button id="sound-toggle" type="button" class="typing-icon" aria-pressed="true" aria-label="音声をオフにする" title="音声オン／オフ"><span class="typing-svg-crop"><img src="../grade34/assets/ui/originals/音声ONOFFと読み方.svg" alt=""></span></button><button id="word-toggle" type="button" class="typing-icon" aria-pressed="false" aria-label="１語ずつ読む" title="１語ずつ読む"><span class="typing-svg-crop second"><img src="../grade34/assets/ui/originals/音声ONOFFと読み方.svg" alt=""></span></button></div><label class="typing-speed">速さ<select id="speech-rate" aria-label="読み上げ速度"><option value="0.55">ゆっくり</option><option value="0.85">ふつう</option><option value="1.2">はやめ</option></select></label><select id="speech-language" aria-label="読み上げ言語"><option value="en-US">英語</option><option value="ja-JP">日本語</option></select></div>
<div id="practice-stats" class="practice-stats" hidden><span id="first-pass"></span><span id="timer"></span></div></header>
<section id="setup" class="panel typing-setup" hidden><h2>レベルを選んでスタート</h2><div class="typing-modes" aria-label="難易度">
<button id="mode-easy" type="button" aria-pressed="true"><strong>Easy</strong><b>発音と音声あり</b><span>英語の発音と、お手本を見ながらタイピングをしましょう。慣れてきたら、お手本を隠してチャレンジしましょう。</span></button>
<button id="mode-normal" type="button" aria-pressed="false"><strong>Normal</strong><b>発音のみ</b><span>Easyでつづりが覚えられたら、Normalにチャレンジ。お手本なしで、英語の発音を聞いてタイピングしましょう。</span></button>
<button id="mode-hard" type="button" aria-pressed="false"><strong>Hard</strong><b>日本語のみ</b><span>いよいよ仕上げです。日本語を聞いたり見たりして、英語のつづりをタイピングしましょう。</span></button></div>
<p id="setup-message" role="status"></p><p id="best-time"></p><p class="help">記録は、この端末のブラウザに教材・レベルごとに保存します。スキップせず全問終えると記録の対象になります。お手本や読み上げ言語の変更を使った場合は自由練習となります。</p><button id="start" class="primary" type="button">スタート</button></section>
<section id="practice" class="panel" hidden>
<div id="meaning" class="meaning"><img id="picture" alt="" hidden><p id="japanese"></p></div>
<div class="actions"><button id="listen" type="button">🔊 発音を聞く</button><button id="toggle-model" type="button" aria-pressed="true">綴りを隠す</button></div>
<section class="model-section" aria-label="お手本"><h2>お手本</h2><p id="model" lang="en" class="spelling"></p></section>
<form id="answer-form"><label for="answer">英語を入力する</label><input id="answer" lang="en" type="text" maxlength="500" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-describedby="feedback"><div class="actions"><button id="check" class="primary" type="submit">答え合わせ</button><button id="next" type="button" hidden>次へ</button><button id="skip" type="button">いったん次へ</button></div></form>
<p id="feedback" role="status" aria-live="polite"></p>
<section id="previous-attempt" hidden aria-label="あなたの入力"><h2>あなたの入力</h2><p id="previous" class="spelling" lang="en"></p><p id="error-detail" role="status"></p><p class="help">上の入力欄に、単語・文の全体をもう一度入力しよう。</p></section>
</section>
<section id="complete" class="panel" tabindex="-1" hidden><h2>練習が終わりました</h2><p id="new-record" class="typing-new-record" role="status" hidden>🏆 New Record!! 🏆</p><p id="result"></p><p id="result-stats"></p><p id="finish-best"></p><p id="record-notice" role="status"></p><div class="actions"><button id="retry-skipped" type="button" hidden>後回しにした問題を練習</button><button id="restart" type="button">もう一度はじめから</button><button id="choose-mode" type="button">レベルを選び直す</button></div></section>
<p id="fatal" role="status" aria-live="polite"></p>
</main><script src="catalog.js"></script><script src="../grade34/share-codec.js"></script><script src="typing-core.js?v=20261028"></script><script src="typing-player.js?v=20261028e"></script></body></html>
