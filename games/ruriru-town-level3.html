<!doctype html>
<html lang="ja">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>RuRiRu Town LEVEL 3 — 声で道案内</title>
 <link rel="stylesheet" href="ruriru-town-level3.css?v=1">
 <script src="ruriru-town-level2-model.js?v=9d8041ba923f" defer></script>
 <script src="ruriru-town-level3-model.js?v=c68ff1cbfee4" defer></script>
 <script src="ruriru-town-level3-speech.js?v=1" defer></script>
 <script src="ruriru-town-level3.js?v=e41a196d1f13" defer></script>
</head>
<body>
<main class="app">
 <section class="left-column" aria-label="地図と音声入力">
  <div class="map-wrap"><div class="stage" id="stage">
   <img class="map" src="assets/ruriru-town/level3-map.webp" width="1448" height="1086" alt="RuRiRu Town LEVEL 3：4列・3段の町。施設をタップして目的地にできます。" aria-describedby="map-description">
   <div id="map-description" class="visually-hidden">道路は格子状です。横道は上から1〜4、縦道は左から1〜5。A〜Nは外周のスタート地点です。施設は右側の一覧からも選べます。</div>
   <div id="destinations" aria-label="地図の施設"></div>
   <div id="markers" aria-hidden="true"></div>
   <div class="side-arrow" id="sideArrow" hidden aria-hidden="true">➜</div>
   <div class="character" id="char" hidden><img id="sprite" src="assets/ruriru-town/characters/south-0.png" alt="道案内のキャラクター"></div>
   <div class="success" id="success" role="status" hidden><strong>GOAL!</strong><span id="successText"></span></div>
  </div></div>
  <section class="voice-panel" aria-label="一文ずつ話して動かす">
   <div class="voice-actions">
    <button class="mic primary" id="record" type="button" disabled><span class="mic-icon" aria-hidden="true">🎤</span><span id="recordLabel">音声入力</span></button>
    <button class="undo" id="undo" type="button" disabled>↶ 1つ戻る</button>
   </div>
   <div class="recognized-wrap">
    <div class="sentence-label"><span>聞き取った英文</span><span id="voiceState" class="voice-state">準備中</span></div>
    <p class="recognized placeholder" id="recognized" aria-live="polite">スタートと目的地を選ぼう。</p>
    <p class="feedback" id="feedback" role="status" aria-live="polite">まずは A〜N からスタートを選んでね。</p>
   </div>
   <button class="execute" id="execute" type="button" disabled><span aria-hidden="true">▶</span> 動かす</button>
  </section>
 </section>
 <aside class="panel" aria-label="スタート・ヒント・目的地">
  <header class="panel-heading"><div><h1>RuRiRu Town <span>LEVEL 3</span></h1><p>自分の声で、道案内しよう。</p></div><button class="icon-button" id="reset" type="button" aria-label="はじめから">↻</button></header>
  <section class="start-section" aria-labelledby="start-label"><h2 id="start-label"><span class="step">1</span> START <span class="section-note">スタート</span></h2><div class="starts" id="starts" role="group" aria-labelledby="start-label"></div></section>
  <section class="hint-section" aria-labelledby="hint-label">
   <div class="section-heading"><h2 id="hint-label">HINT <span class="section-note">こまったときに</span></h2><button class="hint-button" id="showHint" type="button" disabled>ヒントを表示</button></div>
   <div class="hint-content"><p id="hintSentence" class="hint-placeholder" aria-live="polite">まずは自分で話してみよう。</p><button id="readHint" class="read-hint" type="button" aria-label="ヒントの一文を聞く" hidden disabled>🔊</button></div>
  </section>
  <section class="goal-section" aria-labelledby="goal-label"><h2 id="goal-label"><span class="step">2</span> GOAL <span class="section-note">目的地</span></h2><p class="selected-goal" id="selectedGoal">地図か一覧で施設を選ぼう。</p><div class="facilities" id="facilityList" role="group" aria-labelledby="goal-label"></div></section>
  <p class="visually-hidden" id="location" role="status" aria-live="polite" aria-atomic="true"></p>
 </aside>
</main>
<dialog id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmNote"><form method="dialog"><h2 id="confirmTitle"></h2><p id="confirmNote"></p><div class="dialog-actions"><button value="cancel">いいえ</button><button value="yes" class="primary">はい</button></div></form></dialog>
<audio id="turnSound" preload="auto" src="assets/ruriru-town/audio/turn.mp3"></audio>
<audio id="placeSound" preload="auto" src="assets/ruriru-town/audio/place.mp3"></audio>
<audio id="walkSound" preload="auto" loop src="assets/ruriru-town/audio/walk.mp3"></audio>
<audio id="arrivalSound" preload="auto" src="assets/ruriru-town/audio/arrival.mp3"></audio>
</body></html>
