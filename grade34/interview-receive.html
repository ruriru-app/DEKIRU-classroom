<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Interview | DEKIRU Classroom</title><link rel="stylesheet" href="styles.css?v=40ecd275082d"><link rel="stylesheet" href="interview-student.css?v=4443a12d5f88"></head>
<body class="interview-student"><main class="student-shell" id="studentShell">
<header class="student-top"><button id="interviewReceiveBack" class="student-back" type="button" aria-label="戻る"><img src="assets/ui/originals/戻る.svg" alt=""></button><h1 id="studentTitle">INTERVIEW</h1>
<div class="student-audio" id="studentAudio" hidden><button id="soundToggle" type="button" aria-label="音声ON/OFF" aria-pressed="true"><span class="student-crop"><img src="assets/ui/originals/音声ONOFFと読み方.svg" alt=""></span></button><button id="wordToggle" type="button" aria-label="１語ずつ読む" aria-pressed="false"><span class="student-crop second"><img src="assets/ui/originals/音声ONOFFと読み方.svg" alt=""></span></button><label>速さ <select id="speechRate" aria-label="読み上げ速度"><option value="0.55">ゆっくり</option><option value="0.85">ふつう</option><option value="1.20">はやめ</option></select></label></div>
<button id="studentRestart" class="student-small" type="button" hidden>はじめから</button><button id="studentFullscreen" class="student-small" type="button" aria-label="全画面表示">⛶</button></header>
<div><p id="receiveError" role="alert"></p><p id="studentStatus" role="status" aria-live="polite"></p></div>
<div id="receiveContent" hidden><section id="composeScreen" class="student-compose"><h2>質問したいカードをえらぼう</h2><div id="composeQuestion" class="student-question"></div><div id="studentChoices" class="student-choices"></div><button id="startInterview" class="student-primary" disabled>Interviewをはじめる</button></section>
<section id="sheetScreen" class="student-sheet" hidden><div id="questionCards" class="student-question"></div><div id="answerAreas" class="student-answer-grid"></div><section id="unassignedArea" class="student-area" data-area-id="" tabindex="0" role="group" aria-label="未実施へ移す"><h2><span id="unassignedTitle">未実施</span><span aria-hidden="true">＋</span></h2><div class="student-names" id="unassignedNames"></div></section></section></div>
<dialog id="restartDialog" class="student-dialog"><p>現在の質問と回答をリセットして、はじめからやり直しますか？</p><menu><button id="restartCancel">キャンセル</button><button id="restartConfirm">やり直す</button></menu></dialog>
</main><script src="data/app-data.js?v=27808b03bd14"></script><script src="data/lt2-data.js?v=3a28115f921a"></script><script src="data/picture-links.js?v=971a22771806"></script>
  <script src="data/preview-pictures.js?v=6ed2017e96f1"></script><script src="lets-try-game-cards.js?v=958cd99292c8"></script><script src="interview-model.js?v=4973b30b818f"></script><script src="share-codec.js?v=81991ea3d776"></script><script src="interview-share-presets.js?v=e434e99c3aa9"></script><script src="interview-share.js?v=95f723f0cabf"></script><script src="interview-session.js?v=846ef8a794fc"></script><script src="interview-progress.js?v=d4489a0199a1"></script><script src="interview-audio.js?v=a244ee5c1142"></script><script src="interview-receive.js?v=b0e7378a7cc7"></script><script src="common-ui.js?v=5b3d99baf5a9"></script></body></html>
