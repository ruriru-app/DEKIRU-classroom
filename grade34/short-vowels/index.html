<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#136b62">
  <meta name="description" content="DEKIRU Classroomのフォニックス教材。25語の短母音を練習する学習モード、印刷用ワークシート、タイピング。">
  <title>Short Vowels | DEKIRU Classroom</title>
  <link rel="stylesheet" href="../styles.css?v=40ecd275082d"><link rel="stylesheet" href="style.css?v=letter-tiles-10">
  <script src="../common-ui.js?v=5b3d99baf5a9" defer></script>
  <script src="state.js?v=letter-tiles-10" defer></script><script src="app.js?v=letter-tiles-10" defer></script>
</head>
<body>
<header class="app-header"><a id="brand-home" class="brand" href="../../grade56/index.html#/" aria-label="トップへ戻る"><img id="classroom-logo" src="../assets/ui/branding/logo-grade56.svg" alt="DEKIRU Classroom for Grade 5 &amp; 6"></a><nav class="header-actions" aria-label="共通メニュー"><a id="home" class="icon-button" href="../../grade56/index.html#/" aria-label="ホーム"><img src="../assets/ui/originals/ホームアイコン.svg" alt=""></a><button class="icon-button" id="settings-button" type="button" aria-label="設定"><img src="../assets/ui/originals/設定アイコン.svg" alt=""></button></nav></header>
<div class="app-main sv-workspace">
 <aside class="sv-sidebar">
  <div class="page-heading"><a id="back" class="back-button" href="../phonics.html?from=nh5" aria-label="Phonicsへ戻る"><img src="../assets/ui/originals/戻る.svg" alt=""></a><h1>Short Vowels</h1></div>
  <nav class="modes" aria-label="学習モード">
   <button type="button" data-mode="overview" aria-pressed="true">一覧表示</button>
   <button type="button" data-mode="cards" aria-pressed="false">一語づつ読む</button>
   <button type="button" data-mode="guess" aria-pressed="false">文字を読む</button>
   <button type="button" data-mode="letters" aria-pressed="false">綴りを思い出す</button>
   <button type="button" data-mode="worksheets" aria-pressed="false">ワークシート</button>
   <button type="button" data-mode="typing" aria-pressed="false">タイピング</button>
  </nav>
 </aside>
 <main id="teaching-content" class="sv-content">
  <div class="content-heading"><button id="exit-fullscreen" class="back-button" type="button" aria-label="全画面を解除して戻る" hidden><img src="../assets/ui/originals/戻る.svg" alt=""></button><h2 id="mode-title">一覧表示</h2><button id="fullscreen" class="quiet-button" type="button" aria-label="全画面表示">⛶ <span>全画面</span></button></div>
    <section id="overview" aria-label="25語の一覧">
      <div class="section-top"><p>絵をタップすると、1語ずつ表示できます。</p><span>5 vowels · 25 words</span></div>
      <div class="word-grid" id="word-grid"></div>
    </section>
    <section id="lesson" aria-label="単語の練習" hidden>
      <div class="lesson-top"><span class="vowel-badge" id="vowel-badge"></span><span id="progress"></span><div class="lesson-tools"><label class="random-toggle"><input id="random-order" type="checkbox">ランダム</label><button id="reshuffle" type="button" class="quiet-button" hidden>並べ替え</button><button id="reset" type="button" class="quiet-button">↺ もう一度</button></div></div>
      <div id="stage" class="stage">
        <span class="picture-area"><img id="picture" alt="" draggable="false"><span id="picture-hidden" class="picture-hidden" aria-hidden="true"><span>?</span></span></span>
        <span id="word" class="big-word" lang="en"></span>
        <button id="reveal-picture" type="button" aria-label="イラストを表示" hidden></button>
      </div>
      <div class="lesson-bottom"><button id="previous" class="step-button" type="button">← 前へ</button><p id="instruction" aria-live="polite"></p><button id="next" class="step-button primary" type="button">次へ →</button></div>
      <div class="word-rail" id="word-rail" aria-label="単語を選ぶ"></div>
    </section>
    <section id="worksheets" aria-labelledby="mode-title" hidden>
      <p class="worksheet-format">A4横・各1ページ</p>
      <article class="worksheet-row" aria-labelledby="ipa-title">
        <h3 id="ipa-title">発音記号つき単語一覧</h3>
        <div class="worksheet-actions">
          <a class="step-button primary" href="worksheets/short-vowels-ipa.pdf" target="_blank" rel="noopener" aria-describedby="ipa-title">PDFを開く</a>
          <a class="step-button" href="worksheets/short-vowels-ipa.pdf" download aria-describedby="ipa-title">ダウンロード</a>
        </div>
      </article>
      <article class="worksheet-row" aria-labelledby="writing-title">
        <h3 id="writing-title"><span lang="en">Let's Write!</span>（通常版）</h3>
        <div class="worksheet-actions">
          <a class="step-button primary" href="worksheets/short-vowels-writing.pdf" target="_blank" rel="noopener" aria-describedby="writing-title">PDFを開く</a>
          <a class="step-button" href="worksheets/short-vowels-writing.pdf" download aria-describedby="writing-title">ダウンロード</a>
          <button class="step-button" type="button" data-worksheet-projection="standard" aria-describedby="writing-title">全画面で投影</button>
        </div>
      </article>
      <article class="worksheet-row" aria-labelledby="random-title">
        <h3 id="random-title"><span lang="en">Let's Write!</span>（ランダム版）</h3>
        <div class="worksheet-actions">
          <a class="step-button primary" href="worksheets/short-vowels-writing-random.pdf" target="_blank" rel="noopener" aria-describedby="random-title">PDFを開く</a>
          <a class="step-button" href="worksheets/short-vowels-writing-random.pdf" download aria-describedby="random-title">ダウンロード</a>
          <button class="step-button" type="button" data-worksheet-projection="random" aria-describedby="random-title">全画面で投影</button>
        </div>
      </article>
    </section>
    <section id="worksheet-projection" aria-labelledby="mode-title" hidden>
      <div class="word-grid" id="projection-grid"></div>
    </section>
    <section id="typing" aria-labelledby="mode-title" hidden>
      <div class="worksheet-actions">
        <a id="open-typing" class="step-button primary" href="typing/" target="_blank" rel="noopener">別ウインドウで開く</a>
        <button id="copy-typing-url" class="step-button" type="button">URLをコピーする</button>
      </div>
      <p id="typing-copy-status" class="typing-copy-status" role="status"></p>
      <input id="typing-share-url" type="url" aria-label="タイピング教材のURL" readonly hidden>
    </section>
 </main>
</div>
<noscript>この教材を使うには、ブラウザーのJavaScriptを有効にしてください。</noscript>
</body>
</html>
