<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff9ec" />
    <title>RuRiRu BURGER SHOP — LEVEL SELECTION</title>
    <link rel="stylesheet" href="./level-select.css?v=20261103c" />
  </head>
  <body>
    <main class="selection-shell">
      <header class="shop-header">
        <img class="shop-logo" src="./assets/brand-ruriru-burger-logo-v1.png" alt="RuRiRu BURGER SHOP" width="220" height="86" />
        <div class="header-message"><span class="small-spark" aria-hidden="true">✦</span> 英語で おもてなし <span class="mode-pill">NORMAL</span></div>
      </header>

      <section class="level-selection" aria-labelledby="selection-title">
        <div class="section-heading">
          <div><p class="eyebrow">LEVEL SELECTION</p><h1 id="selection-title">どのお店で接客する？</h1></div>
          <p class="selection-help" id="selection-help">お店をえらんでね</p>
        </div>

        <div class="level-grid" role="radiogroup" aria-labelledby="selection-title" aria-describedby="selection-help">
          <button class="level-card level-1 is-selected" id="level-option-1" type="button" role="radio" aria-checked="true" aria-labelledby="level-label-1 level-name-1" aria-describedby="level-rules-1 level-availability-1" tabindex="0" data-level="1">
            <span class="card-picture"><img src="./assets/level1-background.png" alt="" width="1536" height="1024" /><img class="card-crowd" src="./assets/level1-crowd-v1.png" alt="" width="1536" height="1024" aria-hidden="true" /><span class="selection-marker" aria-hidden="true">✓<span>えらんでいるお店</span></span></span>
            <span class="card-content"><span class="card-heading"><span class="level-label" id="level-label-1">LEVEL <b>1</b></span><span class="availability" id="level-availability-1">遊べる</span></span><strong class="store-name" id="level-name-1">屋台</strong><span class="card-rules" id="level-rules-1"><span>お客さん <b>1</b> 人</span><span>注文 <b>1〜2</b> 種類 · 合計 <b>1〜3</b> 個</span></span></span>
          </button>
          <button class="level-card level-2 is-locked" id="level-option-2" type="button" disabled aria-disabled="true" role="radio" aria-checked="false" aria-labelledby="level-label-2 level-name-2" aria-describedby="level-rules-2 level-availability-2 level-unlock-2" tabindex="-1" data-level="2">
            <span class="card-picture"><img src="./assets/level2-background.png" alt="" width="1536" height="1024" /><img class="card-crowd" src="./assets/level2-crowd-v2.png" alt="" width="1536" height="1024" aria-hidden="true" /><span class="selection-marker" aria-hidden="true">✓<span>えらんでいるお店</span></span></span>
            <span class="card-content"><span class="card-heading"><span class="level-label" id="level-label-2">LEVEL <b>2</b></span><span class="availability" id="level-availability-2">未解放</span><span class="visually-hidden" id="level-unlock-2">LEVEL1の★★★で選べます。</span></span><strong class="store-name" id="level-name-2">フードコート</strong><span class="card-rules" id="level-rules-2"><span>お客さん <b>2</b> 人</span><span>注文 <b>2〜3</b> 種類 · 合計 <b>2〜6</b> 個</span></span></span>
          </button>
          <button class="level-card level-3 is-locked" id="level-option-3" type="button" disabled aria-disabled="true" role="radio" aria-checked="false" aria-labelledby="level-label-3 level-name-3" aria-describedby="level-rules-3 level-availability-3 level-unlock-3" tabindex="-1" data-level="3">
            <span class="card-picture"><img src="./assets/level3-background.png" alt="" width="1536" height="1024" /><img class="card-crowd" src="./assets/level3-crowd-v2.png" alt="" width="1536" height="1024" aria-hidden="true" /><span class="selection-marker" aria-hidden="true">✓<span>えらんでいるお店</span></span></span>
            <span class="card-content"><span class="card-heading"><span class="level-label" id="level-label-3">LEVEL <b>3</b></span><span class="availability" id="level-availability-3">未解放</span><span class="visually-hidden" id="level-unlock-3">LEVEL2の★★★で選べます。</span></span><strong class="store-name" id="level-name-3">独立店舗</strong><span class="card-rules" id="level-rules-3"><span>お客さん <b>3</b> 人</span><span>注文 <b>3〜4</b> 種類 · 合計 <b>4〜9</b> 個</span></span></span>
          </button>
          <button class="level-card level-4 is-locked" id="level-option-4" type="button" disabled aria-disabled="true" role="radio" aria-checked="false" aria-labelledby="level-label-4 level-name-4" aria-describedby="level-rules-4 level-availability-4 level-unlock-4" tabindex="-1" data-level="4">
            <span class="card-picture"><img src="./assets/level4-background.png" alt="" width="1536" height="1024" /><img class="card-crowd" src="./assets/level4-crowd-v2.png" alt="" width="1536" height="1024" aria-hidden="true" /><span class="selection-marker" aria-hidden="true">✓<span>えらんでいるお店</span></span></span>
            <span class="card-content"><span class="card-heading"><span class="level-label" id="level-label-4">LEVEL <b>4</b></span><span class="availability" id="level-availability-4">未解放</span><span class="visually-hidden" id="level-unlock-4">LEVEL3の★★★で選べます。</span></span><strong class="store-name" id="level-name-4">リゾート</strong><span class="card-rules" id="level-rules-4"><span>お客さん <b>4</b> 人</span><span>注文 <b>3〜5</b> 種類 · 合計 <b>6〜12</b> 個</span></span></span>
          </button>
        </div>

        <section class="selected-panel" aria-labelledby="selected-title">
          <div class="selected-information" aria-live="polite" aria-atomic="true">
            <p class="selected-label">えらんだお店</p>
            <h2 id="selected-title"><span id="selected-level">LEVEL 1</span><strong id="selected-name">屋台</strong></h2>
            <p class="selected-rule" id="selected-rule">3人の中からランダムに1人が来店。注文は1〜2種類・合計1〜3個です。</p>
          </div>
          <div class="start-area">
            <p class="start-status" id="start-status" role="status">1人のお客さんを接客しよう！</p>
            <button class="play-button" id="preparing-button" type="button" hidden disabled aria-describedby="start-status">LEVEL1を遊ぶ <span aria-hidden="true">→</span></button>
            <a class="play-button" id="play-link" href="./play.html?level=1" aria-describedby="start-status">LEVEL1を遊ぶ <span aria-hidden="true">→</span></a>
          </div>
        </section>
      </section>
      <footer class="preview-footer">★★★で次のLEVELが開きます。記録はこのブラウザーに保存されます。</footer>
    </main>
    <script src="./normal-progression.js?v=20261103c"></script>
    <script src="./level-select.js?v=20261103c"></script>
  </body>
</html>
